// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    ext {
        // It's a good practice to define versions in a central place
        // For this task, versions are hardcoded in dependencies, but ext block is good for maintainability.
        // agp_version = '8.2.0'
        // kotlin_version = '1.9.21'
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.2.0'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.21'
        // Example: If using Hilt for dependency injection
        // classpath 'com.google.dagger:hilt-android-gradle-plugin:2.48' // Check for latest Hilt version
    }
}

plugins {
    // These plugins are applied to the subprojects (e.g., app module) through their respective build.gradle files.
    // 'apply false' means they are not applied to the root project itself.
    id 'com.android.application' version '8.2.0' apply false
    id 'org.jetbrains.kotlin.android' version '1.9.21' apply false
    // id 'com.android.library' version '8.2.0' apply false // Uncomment if you have library modules
    // id 'com.google.dagger.hilt.android' version '2.48' apply false // Example for Hilt
}

allprojects {
    repositories {
        google()
        mavenCentral()
        // Add other repositories here if needed by your dependencies
        // e.g., maven { url 'https://jitpack.io' }
    }
}

// A common task to clean the build directory
task clean(type: Delete) {
    delete rootProject.buildDir
}
