plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    // If you use libraries that require annotation processing (e.g., Dagger, Room, Glide), add:
    // id 'kotlin-kapt'
    // For Navigation Safe Args:
    // id 'androidx.navigation.safeargs.kotlin'
}

android {
    namespace "com.forkial"
    compileSdk 34

    defaultConfig {
        applicationId "com.forkial"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // Vector drawables options
        vectorDrawables {
            useSupportLibrary true
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // signingConfig signingConfigs.release // Example for custom signing
        }
        debug {
            // applicationIdSuffix ".debug" // Optional: for unique debug app ID
            // debuggable true // Default is true for debug builds
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        viewBinding true
        // dataBinding = true // Enable if you want to use Data Binding
        // compose = true // Enable if you want to use Jetpack Compose
    }
    // composeOptions { // Add if using Jetpack Compose
    //     kotlinCompilerExtensionVersion = "1.5.3" // Use the version compatible with your Kotlin and Compose versions
    // }
    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    // Core & UI
    implementation "androidx.core:core-ktx:1.12.0"
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "com.google.android.material:material:1.11.0"
    implementation "androidx.constraintlayout:constraintlayout:2.1.4" // Use if not primarily using Compose for layouts
    implementation "androidx.recyclerview:recyclerview:1.3.2"

    // Lifecycle (ViewModel, LiveData) - For MVVM architecture
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0"
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:2.7.0"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.7.0" // Includes lifecycleScope for coroutines
    implementation "androidx.activity:activity-ktx:1.8.2" // Includes by viewModels() delegate

    // Coroutines for asynchronous programming
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3" // Optional, if you need core components separate from Android
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3"

    // Navigation Component - For navigating between screens
    implementation "androidx.navigation:navigation-fragment-ktx:2.7.6"
    implementation "androidx.navigation:navigation-ui-ktx:2.7.6"

    // TODO: Add Retrofit/Ktor for networking
    // Example for Retrofit:
    // implementation "com.squareup.retrofit2:retrofit:2.9.0"
    // implementation "com.squareup.retrofit2:converter-gson:2.9.0" // Or other converters
    // implementation "com.squareup.okhttp3:logging-interceptor:4.12.0" // For logging network requests

    // TODO: Add Glide/Coil for image loading
    // Example for Coil (Kotlin-first):
    // implementation "io.coil-kt:coil:2.5.0"
    // Example for Glide:
    // implementation "com.github.bumptech.glide:glide:4.16.0"
    // kapt "com.github.bumptech.glide:compiler:4.16.0" // If using Glide's annotations

    // Testing
    testImplementation "junit:junit:4.13.2"
    androidTestImplementation "androidx.test.ext:junit:1.1.5"
    androidTestImplementation "androidx.test.espresso:espresso-core:3.5.1"

    // Optional: For UI testing with Espresso on custom components or RecyclerViews
    // androidTestImplementation "androidx.test.espresso:espresso-contrib:3.5.1"

    // Optional: For testing Navigation
    // androidTestImplementation "androidx.navigation:navigation-testing:2.7.6"
}
